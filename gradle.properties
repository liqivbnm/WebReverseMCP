# 内存受限环境：降低堆内存、禁用并行，避免 OOM
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseSerialGC -Djava.net.preferIPv4Stack=true
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true
# Kotlin 编译在 Gradle daemon 内执行，避免第二个 JVM 导致 OOM
kotlin.compiler.execution.strategy=in-process

# 走沙箱本地代理（Java 不读取 HTTP_PROXY 环境变量，需显式配置）
# 本机构建无本地代理时留空即可（Gradle 默认直连）。
# 如需代理，取消注释并按需修改：
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=18080
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=18080
# systemProp.http.nonProxyHosts=localhost|127.0.0.1

# R8 full mode 内存开销大，受限环境关闭
android.enableR8.fullMode=false

# ---- Release 签名（不再硬编码于 build.gradle.kts）----
# 密码优先从环境变量读取（CI/构建机注入），其次回退到 gradle.properties。
# 环境变量：WRMCP_STORE_PASSWORD / WRMCP_KEY_ALIAS / WRMCP_KEY_PASSWORD
# 若未配置，则回退 debug 签名（保证本地可构建，但不生成正式发布包）。
# 开源仓库注意事项：keystore 文件与密码属于敏感信息，请勿提交到公共仓库。
# 如需要正式签名，请自行生成 keystore，并通过环境变量或本地私有 gradle.properties 注入密码。
wrmcp.keyAlias=webreverse
